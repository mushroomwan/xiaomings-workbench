<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>小明的工作台</title>
<!-- PWA 支持（manifest 动态加载，file:// 直接打开不报错） -->
<meta name="theme-color" content="#B8707A">
<meta name="application-name" content="小明工作台">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="小明工作台">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23B8707A'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='white'%3E👶%3C/text%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23B8707A'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='white'%3E👶%3C/text%3E%3C/svg%3E">
<script>
// 仅 HTTP 协议下加载 manifest.json（PWA 安装用）
if (location.protocol.startsWith('http')) {
  var m = document.createElement('link');
  m.rel = 'manifest';
  m.href = 'manifest.json';
  document.head.appendChild(m);
}
</script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap');

  :root {
    --bg: #FBF5F2;
    --card-bg: rgba(255, 252, 250, 0.95);
    --primary: #B8707A;
    --primary-light: #C89098;
    --accent: #D4A0AC;
    --accent-warm: #E8B5B8;
    --text: #4A3640;
    --text-light: #8A7A82;
    --border: rgba(184, 112, 122, 0.15);
    --shadow: rgba(74, 54, 64, 0.08);
    --baby-pink: #E8B5B8;
    --baby-pink-light: #F9E6E8;
    --baby-yellow: #E8D5A8;
    --period: #C87070;
    --happy: #E8B86D;
    --good: #E8D5A8;
    --good-warm: #D4A373;
    --angry: #D49090;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Noto Serif SC', 'Songti SC', 'STSong', serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 14px;
    background-image:
      radial-gradient(circle at 20% 80%, rgba(212, 160, 172, 0.10) 0%, transparent 50%),
      radial-gradient(circle at 80% 20%, rgba(184, 112, 122, 0.06) 0%, transparent 50%);
  }

  .container { max-width: 1200px; margin: 0 auto; }

  header { text-align: center; margin-bottom: 16px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
  header h1 { font-size: 1.4rem; font-weight: 700; color: var(--primary); letter-spacing: 3px; margin-bottom: 4px; }
  header .subtitle { font-size: 0.75rem; color: var(--text-light); letter-spacing: 1.5px; }
  .header-row { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 6px; }
  header .date-display { font-size: 0.72rem; color: var(--accent); font-weight: 600; }
  .refresh-btn { background: none; border: 1.5px solid var(--border); border-radius: 8px; padding: 3px 8px; font-size: 0.65rem; color: var(--text-light); cursor: pointer; line-height: 1.4; }
  .refresh-btn:active { background: rgba(184,112,122,0.08); color: var(--primary); }

  .dashboard { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
  .span-2 { grid-column: span 2; }
  .row-span-2 { grid-row: span 2; }

  .card {
    background: var(--card-bg); border-radius: 16px; padding: 18px;
    border: 1px solid var(--border); box-shadow: 0 4px 16px var(--shadow);
    backdrop-filter: blur(8px);
    animation: fadeIn 0.5s ease forwards;
  }
  .card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
  .card-icon { width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; flex-shrink: 0; }
  .card-title { font-size: 1rem; font-weight: 600; color: var(--primary); letter-spacing: 1px; }
  .card-subtitle { font-size: 0.68rem; color: var(--text-light); margin-top: 1px; }

  .btn {
    padding: 9px 16px; border: none; border-radius: 10px;
    background: linear-gradient(135deg, var(--primary-light), var(--accent));
    color: white; font-family: inherit; font-size: 0.82rem; font-weight: 600; cursor: pointer;
    transition: all 0.2s ease; letter-spacing: 1px;
  }
  .btn:active { transform: scale(0.97); }
  .btn-outline { background: transparent; border: 1.5px solid var(--accent); color: var(--primary); }
  .btn-sm { padding: 6px 12px; font-size: 0.72rem; }

  input, textarea {
    width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px;
    background: rgba(255,255,255,0.6); font-family: inherit; font-size: 0.82rem; color: var(--text);
  }
  input:focus, textarea:focus { outline: none; border-color: var(--accent-warm); }
  textarea { resize: vertical; min-height: 50px; }

  /* === 育儿: 月龄 === */
  .baby-age-card .card-icon { background: linear-gradient(135deg, var(--baby-pink-light), var(--baby-yellow)); }
  .baby-hero { display: flex; align-items: center; gap: 18px; padding: 18px; background: linear-gradient(135deg, var(--baby-pink-light), rgba(232,213,168,0.3)); border-radius: 14px; margin-bottom: 14px; }
  .baby-hero-left { text-align: center; flex-shrink: 0; }
  .baby-avatar { margin: 0 auto 6px; width: 96px; height: 96px; display: block; }
  .baby-avatar img { width: 100%; height: 100%; display: block; }
  .baby-name { font-size: 1.05rem; font-weight: 700; color: var(--primary); letter-spacing: 2px; }
  .baby-age-big { font-size: 1.6rem; font-weight: 700; color: var(--primary); }
  .baby-age-unit { font-size: 0.75rem; color: var(--text-light); }
  .baby-meta { font-size: 0.68rem; color: var(--text-light); margin-top: 5px; }
  .baby-motto { flex: 1; min-width: 0; border-left: 2px solid rgba(184,112,122,0.2); padding-left: 16px; }
  .baby-motto-line { font-size: 0.72rem; font-weight: 600; color: var(--primary); line-height: 2.2; letter-spacing: 1px; text-align: center; }

  /* === 育儿: 辅食安排 === */
  .food-card .card-icon { background: linear-gradient(135deg, #F5E6D3, #E8D5A8); }
  .food-content { display: flex; flex-direction: column; gap: 10px; }
  .food-stage { padding: 10px 12px; background: linear-gradient(135deg, rgba(232,213,168,0.15), rgba(232,181,184,0.08)); border-radius: 10px; }
  .food-stage-label { font-size: 0.58rem; color: var(--text-light); margin-bottom: 4px; letter-spacing: 1px; }
  .food-stage-name { font-size: 0.82rem; font-weight: 700; color: var(--primary); margin-bottom: 4px; }
  .food-stage-desc { font-size: 0.66rem; color: var(--text); line-height: 1.55; }
  .food-log { display: flex; flex-direction: column; }
  .food-input-row { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; }
  .food-input-row input { flex: 1; min-width: 0; font-size: 0.76rem; }
  .food-list { max-height: 90px; overflow-y: auto; }
  .food-empty { text-align: center; color: var(--text-light); font-size: 0.68rem; padding: 10px 8px; }
  .food-item { display: flex; align-items: center; gap: 6px; padding: 5px 8px; background: rgba(232,213,168,0.08); border-radius: 8px; margin-bottom: 4px; font-size: 0.7rem; }
  .food-item-date { font-size: 0.58rem; color: var(--text-light); flex-shrink: 0; }
  .food-item-text { flex: 1; min-width: 0; word-break: break-all; }
  .food-del { background: none; border: none; color: var(--text-light); font-size: 0.7rem; cursor: pointer; padding: 0 4px; flex-shrink: 0; opacity: 0.5; }

  /* === 育儿: 疫苗 === */
  .vaccine-card .card-icon { background: linear-gradient(135deg, #D4E8D4, #B8D4C8); }
  .vaccine-summary { display: flex; gap: 8px; margin-bottom: 10px; }
  .vaccine-stat { flex: 1; text-align: center; padding: 7px 4px; border-radius: 10px; }
  .vaccine-stat.done { background: rgba(168,197,168,0.15); }
  .vaccine-stat.next { background: rgba(232,181,184,0.15); }
  .vaccine-stat-num { font-size: 1.05rem; font-weight: 700; }
  .vaccine-stat.done .vaccine-stat-num { color: #6B9B6B; }
  .vaccine-stat.next .vaccine-stat-num { color: var(--primary); }
  .vaccine-stat-label { font-size: 0.58rem; color: var(--text-light); margin-top: 2px; }
  .vaccine-list { max-height: 200px; overflow-y: auto; }
  .vaccine-item { display: flex; align-items: center; gap: 7px; padding: 6px 8px; border-radius: 8px; margin-bottom: 4px; font-size: 0.72rem; border: 1px solid var(--border); background: rgba(255,255,255,0.5); }
  .vaccine-item.done { opacity: 0.6; }
  .vaccine-item.next { background: var(--baby-pink-light); border-color: var(--baby-pink); }
  .vaccine-check { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; font-size: 0.6rem; color: white; }
  .vaccine-item.done .vaccine-check { background: #6B9B6B; border-color: #6B9B6B; }
  .vaccine-info { flex: 1; min-width: 0; }
  .vaccine-name-text { font-weight: 600; }
  .vaccine-month { font-size: 0.6rem; color: var(--text-light); }
  .vaccine-tag { padding: 2px 6px; border-radius: 7px; font-size: 0.56rem; font-weight: 600; flex-shrink: 0; }
  .vaccine-tag.free { background: rgba(107,155,107,0.15); color: #5A8A5A; }
  .vaccine-tag.paid { background: rgba(232,181,90,0.15); color: #B8843A; }
  .vaccine-tag.now { background: var(--baby-pink); color: white; }
  .vaccine-next-box { background: linear-gradient(135deg, var(--baby-pink-light), rgba(232,213,168,0.2)); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; border: 1.5px solid var(--baby-pink); }
  .vaccine-next-box.empty { text-align: center; color: var(--text-light); font-size: 0.72rem; padding: 14px; border-color: var(--border); background: rgba(168,197,168,0.1); }
  .vaccine-next-label { font-size: 0.6rem; color: var(--text-light); margin-bottom: 3px; }
  .vaccine-next-name { font-size: 0.92rem; font-weight: 700; color: var(--primary); margin-bottom: 4px; }
  .vaccine-next-meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .vaccine-next-date { font-size: 0.68rem; color: var(--accent-warm); font-weight: 600; }
  .vaccine-next-month { font-size: 0.64rem; color: var(--text-light); }
  .vaccine-next-countdown { font-size: 0.64rem; color: var(--baby-pink); margin-top: 4px; font-weight: 600; }
  .vaccine-expand-btn { text-align: center; padding: 8px; cursor: pointer; color: var(--accent-warm); font-size: 0.7rem; font-weight: 600; border-top: 1px dashed var(--border); transition: all 0.2s ease; }
  .vaccine-expand-btn:active { background: rgba(184,112,122,0.04); }
  .vaccine-full-list { margin-top: 8px; animation: fadeIn 0.3s ease; }
  .vaccine-date { font-size: 0.58rem; color: var(--accent-warm); margin-top: 2px; font-weight: 600; }
  .vaccine-item.done .vaccine-date { color: var(--text-light); }
  .vaccine-section-divider { font-size: 0.64rem; color: var(--text-light); font-weight: 600; margin: 8px 0 5px; padding: 3px 0; border-top: 1px dashed var(--border); }
  .vaccine-del-btn { background: none; border: none; color: var(--text-light); font-size: 0.7rem; cursor: pointer; padding: 4px 6px; flex-shrink: 0; opacity: 0.5; }
  .vaccine-del-btn:active { opacity: 1; color: var(--angry); }
  .vaccine-add-row { display: flex; gap: 6px; align-items: center; margin-top: 10px; padding: 8px; background: rgba(184,112,122,0.04); border-radius: 10px; }
  .vaccine-add-row input { padding: 6px 8px; font-size: 0.72rem; }
  .vaccine-item-wrap { margin-bottom: 4px; }
  .vaccine-form { display: none; padding: 6px 8px 8px; background: rgba(184,112,122,0.04); border-radius: 0 0 8px 8px; border: 1px solid var(--border); border-top: none; margin-top: -4px; margin-bottom: 4px; }
  .vaccine-form.active { display: block; animation: fadeIn 0.2s ease; }
  .vaccine-form-row { display: flex; gap: 6px; align-items: center; }
  .vaccine-form-row input[type="date"] { flex: 1; padding: 6px 8px; font-size: 0.72rem; }
  .vaccine-form-row .btn-sm { padding: 6px 10px; font-size: 0.68rem; }

  /* === 生长曲线 === */
  .growth-card .card-icon { background: linear-gradient(135deg, #D4E8D4, #B8D4C8); }
  .growth-latest { display: flex; gap: 8px; margin-bottom: 12px; }
  .growth-stat { flex: 1; text-align: center; padding: 10px 4px; border-radius: 10px; }
  .growth-stat.weight { background: rgba(232,181,184,0.12); }
  .growth-stat.height { background: rgba(168,197,168,0.12); }
  .growth-stat.head { background: rgba(212,163,115,0.12); }
  .growth-stat-val { font-size: 1.15rem; font-weight: 700; }
  .growth-stat.weight .growth-stat-val { color: var(--baby-pink); }
  .growth-stat.height .growth-stat-val { color: #6B9B6B; }
  .growth-stat.head .growth-stat-val { color: var(--accent-warm); }
  .growth-stat-unit { font-size: 0.6rem; color: var(--text-light); }
  .growth-stat-lbl { font-size: 0.62rem; color: var(--text-light); margin-top: 2px; }
  .growth-stat-date { font-size: 0.55rem; color: var(--text-light); margin-top: 1px; opacity: 0.7; }
  .growth-tabs { display: flex; gap: 6px; margin-bottom: 8px; }
  .growth-tab { flex: 1; padding: 7px; border: 1px solid var(--border); border-radius: 8px; background: transparent; color: var(--text-light); font-family: inherit; font-size: 0.72rem; font-weight: 600; cursor: pointer; text-align: center; }
  .growth-tab.active { background: var(--primary); color: white; border-color: var(--primary); }
  .growth-chart-wrap { position: relative; height: 180px; background: rgba(255,255,255,0.4); border-radius: 10px; padding: 8px; margin-bottom: 10px; }
  .growth-input-area { display: flex; flex-direction: column; gap: 8px; padding: 10px; background: rgba(184,112,122,0.04); border-radius: 10px; }
  .growth-input-line { display: flex; gap: 6px; align-items: center; }
  .growth-input-line input { padding: 6px 4px; font-size: 0.72rem; border-radius: 8px; min-width: 0; }
  .growth-input-line input[type="date"] { flex: 1; max-width: 140px; }
  .growth-input-line input[type="number"] { flex: 1; text-align: center; }
  .growth-input-lbl { font-size: 0.58rem; color: var(--text-light); white-space: nowrap; flex-shrink: 0; }
  .growth-input-line .btn-sm { padding: 6px 10px; font-size: 0.68rem; flex-shrink: 0; }
  .growth-field-group { display: flex; align-items: center; gap: 2px; flex: 1; min-width: 0; }
  .growth-field-group input { flex: 1; }
  .growth-records { margin-top: 8px; max-height: 120px; overflow-y: auto; }
  .growth-records-title { font-size: 0.66rem; color: var(--text-light); font-weight: 600; margin-bottom: 5px; }
  .growth-record-item { display: flex; align-items: center; gap: 6px; padding: 5px 8px; background: rgba(255,255,255,0.5); border-radius: 8px; margin-bottom: 4px; font-size: 0.68rem; border: 1px solid var(--border); }
  .growth-record-date { font-size: 0.6rem; color: var(--text-light); flex-shrink: 0; width: 42px; }
  .growth-record-data { flex: 1; color: var(--text); }
  .growth-record-del { background: none; border: none; color: var(--text-light); font-size: 0.7rem; cursor: pointer; padding: 2px 4px; flex-shrink: 0; opacity: 0.5; }
  .growth-record-del:active { opacity: 1; color: var(--angry); }
  .growth-empty { text-align: center; color: var(--text-light); font-size: 0.72rem; padding: 16px 8px; }

  /* === 链接学习笔记 === */
  .link-card .card-icon { background: linear-gradient(135deg, #E0E8F5, #D4C8E8); }
  .link-input-row { display: flex; gap: 6px; margin-bottom: 8px; }
  .link-input-row input { flex: 1; min-width: 0; }
  .platform-hint { font-size: 0.66rem; color: var(--text-light); margin-bottom: 8px; line-height: 1.5; }
  .content-paste { min-height: 70px; margin-bottom: 8px; }
  .assist-btn { padding: 7px 12px; border: 1px dashed var(--accent); border-radius: 8px; background: transparent; color: var(--accent); font-family: inherit; font-size: 0.7rem; cursor: pointer; margin-bottom: 10px; width: 100%; }
  .note-fields { display: grid; gap: 10px; margin-bottom: 14px; }
  .note-field label { display: block; font-size: 0.7rem; font-weight: 600; color: var(--primary); margin-bottom: 6px; letter-spacing: 0.5px; }
  .tag-chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag-chip { padding: 3px 9px; border-radius: 10px; background: rgba(184,112,122,0.06); font-size: 0.65rem; color: var(--text-light); cursor: pointer; }
  .tag-chip.active { background: var(--primary); color: white; }
  .link-notes-list { max-height: 320px; overflow-y: auto; margin-top: 10px; }
  .link-note-item { padding: 12px; background: rgba(184,112,122,0.03); border-radius: 10px; margin-bottom: 8px; border-left: 3px solid var(--accent-warm); }
  .link-note-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 6px; margin-bottom: 6px; }
  .link-note-platform { font-size: 0.62rem; padding: 2px 6px; border-radius: 6px; font-weight: 600; flex-shrink: 0; }
  .platform-xhs { background: #FFE0E8; color: #D14B6E; }
  .platform-dy { background: #E0E8FF; color: #4B6ED1; }
  .platform-bili { background: #E0F0E8; color: #4BA86E; }
  .platform-other { background: rgba(184,112,122,0.1); color: var(--text-light); }
  .link-note-title { word-break: break-all; }
  .link-note-core { font-size: 0.75rem; line-height: 1.5; }
  .link-note-core strong { color: var(--primary); }
  .link-note-tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
  .link-note-tag { font-size: 0.6rem; padding: 2px 6px; border-radius: 6px; background: rgba(184,112,122,0.08); color: var(--primary); }
  .filter-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .filter-chip { padding: 3px 9px; border-radius: 10px; background: transparent; border: 1px solid var(--border); font-size: 0.65rem; color: var(--text-light); cursor: pointer; font-family: inherit; }
  .filter-chip.active { background: var(--primary); color: white; border-color: var(--primary); }
  .save-note-btn { width: 100%; margin-top: 2px; }
  .notes-section-divider { border-top: 1px dashed var(--border); margin: 20px 0 12px; padding-top: 14px; }
  .notes-section-title { font-size: 0.74rem; font-weight: 600; color: var(--text-light); margin-bottom: 10px; letter-spacing: 1px; }
  .delete-btn { background: none; border: none; color: var(--text-light); font-size: 0.85rem; cursor: pointer; padding: 2px 5px; }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  @media (max-width: 640px) {
    body { padding: 10px; }
    header h1 { font-size: 1.2rem; }
    .dashboard { grid-template-columns: 1fr; }
    .span-2 { grid-column: span 1; }
    .row-span-2 { grid-row: span 1; }
    .card { padding: 14px; }
    .baby-hero { flex-direction: column; gap: 14px; }
    .baby-motto { border-left: none; border-top: 1px solid rgba(184,112,122,0.2); padding-left: 0; padding-top: 12px; width: 100%; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>小明的工作台</h1>
    <div class="subtitle">陪伴成长 · 温柔养育 · 共同学习</div>
    <div class="header-row">
      <div class="date-display" id="currentDate"></div>
      <button class="refresh-btn" onclick="forceRefresh()" title="刷新最新版本">🔄 刷新</button>
    </div>
    <div class="sync-status" id="syncStatus" style="font-size:0.65rem;color:var(--text-light);margin-top:4px;"></div>
  </header>

  <div class="dashboard">
    <!-- 小明成长档案 -->
    <div class="card baby-age-card span-2">
      <div class="card-header">
        <div class="card-icon">👶</div>
        <div><div class="card-title">小明成长档案</div><div class="card-subtitle">记录每一寸成长</div></div>
      </div>

<script>
// ==================== 云端同步配置 ====================
// 手动同步：数据默认只存本地 localStorage，不会丢失
// 用户点"上传云端"才上传，点"从云端恢复"才覆盖本地
const CLOUD = {
  OWNER: 'mushroomwan',
  REPO: 'xiaomings-workbench',
  FILE: 'data.json',
  API: 'https://api.github.com/repos/mushroomwan/xiaomings-workbench/contents/data.json'
};

let cloudReady = false;
let isSyncing = false;

// 从 localStorage 读取或首次输入 Token
function getToken(){
  let token = localStorage.getItem('wb_cloud_token');
  if(!token){
    token = prompt('首次使用请输入 GitHub Token\n（输入后会自动保存，下次无需再输）\n\n注意：Token 仅用于上传/恢复数据，不影响本地存储');
    if(token){
      token = token.trim();
      localStorage.setItem('wb_cloud_token', token);
    }
  }
  return token;
}

// 检查云端是否已配置
function checkCloud(){
  const token = getToken();
  cloudReady = token && CLOUD.OWNER && CLOUD.REPO;
  if(cloudReady) CLOUD.TOKEN = token;
}

// 手动上传：把本地数据保存到云端
async function uploadToCloud(){
  if(!cloudReady){ alert('请先配置 Token'); return; }
  if(isSyncing) return;
  isSyncing = true;
  document.getElementById('syncStatus').textContent='⏳ 正在上传...';
  document.getElementById('syncStatus').style.color='var(--text-light)';
  try{
    const allData = {};
    Object.keys(localStorage).forEach(k => { if(k.startsWith('wb_') && k !== 'wb_cloud_token') allData[k] = localStorage.getItem(k); });
    allData._syncTime = Date.now();
    // 用 TextEncoder 处理中文，避免 btoa 的中文问题
    const jsonStr = JSON.stringify(allData);
    let content;
    try {
      content = btoa(unescape(encodeURIComponent(jsonStr)));
    } catch(e) {
      // 备用方案：手动转 base64
      const bytes = new TextEncoder().encode(jsonStr);
      let bin = '';
      bytes.forEach(b => bin += String.fromCharCode(b));
      content = btoa(bin);
    }
    const getRes = await fetch(CLOUD.API+'?ref=main', { headers:{ 'Authorization':'token '+CLOUD.TOKEN } });
    let sha = '';
    if(getRes.ok){ const fileInfo = await getRes.json(); sha = fileInfo.sha || ''; }
    const res = await fetch(CLOUD.API, {
      method:'PUT',
      headers:{ 'Authorization':'token '+CLOUD.TOKEN, 'Content-Type':'application/json' },
      body: JSON.stringify({ message:'同步工作台数据', content:content, sha:sha, branch:'main' })
    });
    if(res.ok){
      document.getElementById('syncStatus').textContent='✅ 上传成功！';
      document.getElementById('syncStatus').style.color='#6B9B6B';
      setTimeout(()=>{ 
        document.getElementById('syncStatus').innerHTML='☁️ 已连接云端 · <a href="javascript:uploadToCloud()" style="color:var(--primary);font-weight:600;">上传</a> / <a href="javascript:restoreFromCloud()" style="color:var(--primary);font-weight:600;">恢复</a>';
      }, 3000);
    } else {
      const errText = await res.text().catch(()=>'');
      let errInfo = 'HTTP '+res.status;
      try { const errJson = JSON.parse(errText); if(errJson.message) errInfo += ': '+errJson.message; } catch(e){}
      document.getElementById('syncStatus').textContent='❌ 上传失败 ('+errInfo+')';
      document.getElementById('syncStatus').style.color='var(--angry)';
    }
  }catch(e){ 
    document.getElementById('syncStatus').textContent='❌ 上传失败:'+e.message; 
    document.getElementById('syncStatus').style.color='var(--angry)';
  }
  isSyncing = false;
}

// 手动恢复：从云端下载数据覆盖本地（会提示确认）
async function restoreFromCloud(){
  if(!cloudReady){ alert('请先配置 Token'); return; }
  if(isSyncing) return;
  if(!confirm('确定从云端恢复数据吗？\n\n⚠️ 这会覆盖本地当前的数据！\n建议先上传当前数据到云端备份。')) return;
  isSyncing = true;
  document.getElementById('syncStatus').textContent='⏳ 正在恢复...';
  try{
    const res = await fetch(CLOUD.API+'?ref=main', { headers:{ 'Authorization':'token '+CLOUD.TOKEN } });
    if(!res.ok){ document.getElementById('syncStatus').textContent='❌ 恢复失败'; isSyncing=false; return; }
    const data = await res.json();
    if(!data.content){ document.getElementById('syncStatus').textContent='❌ 云端无数据'; isSyncing=false; return; }
    const cloudData = JSON.parse(decodeURIComponent(escape(atob(data.content.replace(/\s/g,'')))));
    if(!cloudData || !cloudData._syncTime){ document.getElementById('syncStatus').textContent='❌ 云端无有效数据'; isSyncing=false; return; }
    Object.keys(cloudData).forEach(k => {
      if(k.startsWith('wb_')) localStorage.setItem(k, cloudData[k]);
    });
    document.getElementById('syncStatus').textContent='✅ 恢复成功！正在刷新...';
    setTimeout(()=>{ location.reload(); }, 1000);
  }catch(e){ document.getElementById('syncStatus').textContent='❌ 恢复失败:'+e; }
  isSyncing = false;
}

// 强制刷新页面（绕过 Service Worker 缓存）
function forceRefresh(){
  if('serviceWorker' in navigator){
    navigator.serviceWorker.getRegistration().then(function(reg){
      if(reg){
        reg.unregister().then(function(){
          window.location.reload(true);
        });
      } else {
        window.location.reload(true);
      }
    });
  } else {
    window.location.reload(true);
  }
}

const babyBirth = new Date('2026-02-15');
function calcBabyAge(){
  const now=new Date();
  let months=(now.getFullYear()-babyBirth.getFullYear())*12+(now.getMonth()-babyBirth.getMonth());
  if(now.getDate()<babyBirth.getDate()) months--;
  const lastMonthDate=new Date(babyBirth.getFullYear(),babyBirth.getMonth()+months,babyBirth.getDate());
  const days=Math.floor((now-lastMonthDate)/(1000*60*60*24));
  document.getElementById('babyAgeMonths').textContent=months;
  document.getElementById('babyAgeDays').textContent=days;
}

function renderGrowthChart(){
  const meta = growthMeta[growthMetric];
  const ctx = document.getElementById('growthChart');
  if(growthChartObj) growthChartObj.destroy();
  const valid = growthRecords.filter(r=>r[growthMetric]!=null && r[growthMetric]!=='' && !isNaN(r[growthMetric]));
  const userPts = valid.map(r=>{

  // 组合x轴
  const allLabels = [...userPts.map(p=>p.x), ...refPts.map(p=>p.x)];
  const xSet = new Set(allLabels);
  const xLabels = Array.from(xSet).sort((a,b)=>parseInt(a)-parseInt(b));
  growthChartObj = new Chart(ctx,{
    type:'line',
    data:{labels:xLabels, datasets:[

function addGrowthRecord(){

  if(isNaN(w)&&isNaN(h)&&isNaN(hd)){alert('至少填写一项测量数据');return;}
  // 如果同一天已有记录，更新它
  const idx=growthRecords.findIndex(r=>r.date===date);
  const rec={date, weight:isNaN(w)?(idx>=0?growthRecords[idx].weight:''):w, height:isNaN(h)?(idx>=0?growthRecords[idx].height:''):h, head:isNaN(hd)?(idx>=0?growthRecords[idx].head:''):hd};
  if(idx>=0) growthRecords[idx]=rec;
  else {growthRecords.push(rec);growthRecords.sort((a,b)=>a.date.localeCompare(b.date));}
  saveData(KEYS.growth,growthRecords);
  document.getElementById('growthWeight').value='';
  document.getElementById('growthHeight').value='';
  document.getElementById('growthHead').value='';
  renderGrowthChart();
  renderGrowthRecords();

    const dateId='vaccineDate_'+i;
    const formHtml=checked?'':`<div class="vaccine-form" id="${formId}"><div class="vaccine-form-row"><input type="date" id="${dateId}" value="${getToday()}"><button class="btn btn-sm" onclick="saveVaccineRecord(${i})">保存</button><button class="btn btn-outline btn-sm" onclick="hideVaccineForm('${formId}')">取消</button></div></div>`;
    return `<div class="vaccine-item-wrap"><div class="${cls}"><div class="vaccine-check" onclick="toggleVaccine(${i})">${checked?'✓':''}</div><div class="vaccine-info"><div class="vaccine-name-text">${v.name}${overdue}</div><div class="vaccine-month">建议 ${v.month} 月龄${v.desc?' · '+v.desc:''}</div>${dateStr}</div><span class="vaccine-tag ${v.type}">${v.type==='free'?'免费':'自费'}</span></div>${formHtml}</div>`;
  }).join('');
  if(customVaccines.length){
    html+='<div class="vaccine-section-divider">自费/自选疫苗</div>';
    html+=customVaccines.map((v,i)=>{
      const rec=vaccineData['c'+i], checked=rec&&rec.checked;
      let cls='vaccine-item'; if(checked)cls+=' done';
      const overdue=!checked&&v.month<babyM?'<span style="color:var(--angry);font-size:0.6rem;"> ⚠ 逾期</span>':'';
      const dateStr=checked&&rec.date?`<div class="vaccine-date">📅 接种日期 ${rec.date}</div>`:'';
      const formId='vaccineForm_c'+i;
      const dateId='vaccineDate_c'+i;
      const formHtml=checked?'':`<div class="vaccine-form" id="${formId}"><div class="vaccine-form-row"><input type="date" id="${dateId}" value="${getToday()}"><button class="btn btn-sm" onclick="saveVaccineRecord('c${i}')">保存</button><button class="btn btn-outline btn-sm" onclick="hideVaccineForm('${formId}')">取消</button></div></div>`;
      return `<div class="vaccine-item-wrap"><div class="${cls}"><div class="vaccine-check" onclick="toggleVaccine('c${i}')">${checked?'✓':''}</div><div class="vaccine-info"><div class="vaccine-name-text">${v.name}${overdue}</div><div class="vaccine-month">建议 ${v.month} 月龄${v.desc?' · '+v.desc:''}</div>${dateStr}</div><span class="vaccine-tag paid">自费</span></div>${formHtml}</div>`;
    }).join('');
  }
  document.getElementById('vaccineList').innerHTML=html;
  document.getElementById('vaccineDoneCount').textContent=done;
  document.getElementById('vaccineNextCount').textContent=next;
}
function toggleVaccineList(){
  vaccineExpanded=!vaccineExpanded;
  document.getElementById('vaccineFullList').style.display=vaccineExpanded?'block':'none';
  document.getElementById('vaccineExpandText').textContent=vaccineExpanded?'收起列表 ▴':'查看全部疫苗 ▾';
}
function toggleVaccine(i){
  const rec=vaccineData[i];
  if(rec&&rec.checked){
    // 已接种 → 取消记录
    if(confirm('确定取消该疫苗接种记录吗？')){
      delete vaccineData[i];
      saveData(KEYS.vaccines,vaccineData);
      renderVaccines();
    }
  } else {
    // 未接种 → 展开日期输入表单（先收起其他）
    document.querySelectorAll('.vaccine-form.active').forEach(el=>el.classList.remove('active'));
    const formId=typeof i==='string'&&i.startsWith('c')?'vaccineForm_'+i:'vaccineForm_'+i;
    const form=document.getElementById(formId);
    if(form) form.classList.add('active');
  }
}
function saveVaccineRecord(i){
  const dateId=typeof i==='string'&&i.startsWith('c')?'vaccineDate_'+i:'vaccineDate_'+i;
  const dateInput=document.getElementById(dateId);
  const date=dateInput?dateInput.value.trim():'';
  if(!date){alert('请选择接种日期');return;}
  vaccineData[i]={checked:true, date:date};
  saveData(KEYS.vaccines,vaccineData);
  renderVaccines();
}
function hideVaccineForm(formId){
  const form=document.getElementById(formId);
  if(form) form.classList.remove('active');
}
renderVaccines();

// ==================== 育儿学习笔记 ====================
let linkNotes = loadData(KEYS.linkNotes,[]);
let currentFilter='all';
function toggleTag(el){ el.classList.toggle('active'); }
function saveLinkNote(){
  const learn=document.getElementById('noteLearn').value.trim(),tags=Array.from(document.querySelectorAll('.tag-chip.active')).map(t=>t.textContent);
  if(!learn){alert('请先写点什么');return;}
  linkNotes.unshift({id:Date.now(),learn:learn,tags:tags,time:new Date().toISOString()});
  saveData(KEYS.linkNotes,linkNotes);
  document.getElementById('noteLearn').value='';
  document.querySelectorAll('.tag-chip.active').forEach(t=>t.classList.remove('active'));
  renderLinkNotes();
}
function filterNotes(tag,el){ currentFilter=tag;document.querySelectorAll('.filter-chip').forEach(c=>c.classList.remove('active'));el.classList.add('active');renderLinkNotes(); }
function renderLinkNotes(){
  const el=document.getElementById('linkNotesList');
  let list=linkNotes; if(currentFilter!=='all')list=linkNotes.filter(n=>n.tags&&n.tags.includes(currentFilter));
  if(!list.length){el.innerHTML='<div style="text-align:center;color:var(--text-light);font-size:0.72rem;padding:12px;">还没有学习笔记 📝</div>';return;}
  el.innerHTML=list.map(n=>`<div class="link-note-item"><div class="link-note-header"><div></div><button class="delete-btn" onclick="deleteLinkNote(${n.id})">✕</button></div>${n.learn?`<div class="link-note-core">${n.learn}</div>`:''}${n.tags&&n.tags.length?`<div class="link-note-tags">${n.tags.map(t=>`<span class="link-note-tag">#${t}</span>`).join('')}</div>`:''}<div style="font-size:0.6rem;color:var(--text-light);margin-top:5px;">${formatTime(n.time)}</div></div>`).join('');
}
function deleteLinkNote(id){ linkNotes=linkNotes.filter(n=>n.id!==id);saveData(KEYS.linkNotes,linkNotes);renderLinkNotes(); }
renderLinkNotes();
// ==================== 云端同步初始化 ====================
checkCloud();
if(cloudReady){
  document.getElementById('syncStatus').innerHTML='☁️ 已连接云端 · <a href="javascript:uploadToCloud()" style="color:var(--primary);font-weight:600;">上传</a> / <a href="javascript:restoreFromCloud()" style="color:var(--primary);font-weight:600;">恢复</a>';
} else {
  document.getElementById('syncStatus').textContent='📡 未连接云端（数据保存在本地，不会丢失）';
  document.getElementById('syncStatus').style.color='var(--text-light)';
}
</script>
<script>
// PWA: 注册 Service Worker（仅 http/https 协议下生效，file:// 本地打开时跳过）
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('sw.js').then(function(reg) {
      console.log('ServiceWorker 注册成功');
    }).catch(function(err) {
      console.log('ServiceWorker 注册失败: ', err);
    });
  });
}
// iOS Safari 修复：standalone 状态下处理链接跳转
if (window.navigator.standalone) {
  document.addEventListener('click', function(e) {
    var target = e.target;
    while (target && target.tagName !== 'A') target = target.parentNode;
    if (target && target.href && target.href.indexOf('http') === 0) {
      e.preventDefault();
      window.location = target.href;
    }
  });
}
</script>
